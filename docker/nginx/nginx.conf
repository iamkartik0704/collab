# Collab edge proxy: TLS termination, compression, rate limits, static caching.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format main escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
                              '"ua":"$http_user_agent","rid":"$request_id"}';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  # Largest bodies are webhooks / JSON (64 KB app limit); images go straight to object storage.
  client_max_body_size 1m;

  # ---- compression (brotli needs the ngx_brotli module; gzip is built in) ----------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

  # ---- rate limiting (per client IP; the app applies finer per-user limits in Redis) -----
  limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
  limit_req_zone $binary_remote_addr zone=checkout:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m     rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  # Docker's embedded DNS resolves service names (app, redis, ...) and forwards everything else, so
  # it also serves OCSP stapling. The short TTL keeps `upstream ... resolve` in sync with recreated
  # containers; without it nginx pins the first app IP forever and every deploy 502s.
  resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
  resolver_timeout 5s;

  include /etc/nginx/conf.d/*.conf;
}
