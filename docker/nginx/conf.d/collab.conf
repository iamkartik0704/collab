# Replace collab.example.com with the real host (must equal APP_URL). Certificates are mounted at
# /etc/nginx/certs (fullchain.pem + privkey.pem), e.g. from certbot using the ACME webroot below.

upstream collab_app {
  # Docker DNS resolves "app" to every replica of the service.
  server app:3000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name collab.example.com;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name collab.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # HSTS is also sent by the app in production; CSP / frame / nosniff headers come from the app
  # (per-request nonce), so they are not duplicated here.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  limit_conn perip 50;

  # NOTE: every proxy_set_header must stay at server level. Declaring one inside a location
  # silently drops all of these there (nginx does not merge them), including X-Real-IP.
  # The app trusts X-Real-IP (set from the TCP peer, so clients cannot spoof it).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Request-Id      $request_id;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # ---- immutable build assets -------------------------------------------------------------
  location /_next/static/ {
    proxy_pass http://collab_app;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }
  location /images/ {
    proxy_pass http://collab_app;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # ---- Server-Sent Events: no buffering, long-lived ------------------------------------------
  location = /api/admin/inventory/stream {
    proxy_pass http://collab_app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }
  location = /api/ai/chat {
    limit_req zone=ai burst=10 nodelay;
    proxy_pass http://collab_app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
  }

  # ---- sensitive endpoints --------------------------------------------------------------------
  location ~ ^/api/auth/(otp|callback|signin) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://collab_app;
  }
  location ~ ^/api/(checkout|cart/coupon) {
    limit_req zone=checkout burst=10 nodelay;
    proxy_pass http://collab_app;
  }
  # Provider webhooks: signature-verified by the app; never rate limited away (they retry).
  location /api/webhooks/ {
    proxy_pass http://collab_app;
    proxy_read_timeout 30s;
  }
  location = /api/health {
    proxy_pass http://collab_app;
    access_log off;
  }

  location / {
    limit_req zone=general burst=60 nodelay;
    proxy_pass http://collab_app;
  }
}
